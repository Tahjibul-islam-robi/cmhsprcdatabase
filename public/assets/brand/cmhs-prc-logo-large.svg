<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" width="3720" height="1560" role="img" aria-label="CMHSPR Programming and Robotics Club logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>CMHS Programming and Robotics Club</title>
  <rect width="3720" height="1560" fill="#000"/>

  <g fill="#3A8FD6" stroke="none">
    <!-- Antenna dots -->
    <circle cx="78" cy="128" r="16"/>
    <circle cx="264" cy="128" r="16"/>
  </g>

  <g fill="none" stroke="#3A8FD6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Antennas -->
    <line x1="105" y1="205" x2="80" y2="140" stroke-width="14"/>
    <line x1="235" y1="205" x2="262" y2="140" stroke-width="14"/>

    <!-- Robot ring -->
    <circle cx="170" cy="270" r="92" stroke-width="18"/>

    <!-- Code brackets with slash -->
    <polyline points="148,235 112,270 148,305" stroke-width="12"/>
    <polyline points="192,235 228,270 192,305" stroke-width="12"/>
    <line x1="181" y1="228" x2="159" y2="312" stroke-width="9"/>

    <!-- C with ++ -->
    <path d="M444 193 A100 100 0 1 0 444 347" stroke-width="24" stroke-linecap="butt"/>
    <g stroke-width="8">
      <line x1="355" y1="270" x2="381" y2="270"/>
      <line x1="368" y1="257" x2="368" y2="283"/>
      <line x1="389" y1="270" x2="415" y2="270"/>
      <line x1="402" y1="257" x2="402" y2="283"/>
    </g>
  </g>

  <!-- Letters M H S P R -->
  <g fill="#3A8FD6" fill-rule="evenodd">
    <!-- M -->
    <polygon points="490,350 490,190 530,190 555,240 580,190 620,190 620,350 590,350 590,250 562,302 548,302 520,250 520,350"/>
    <!-- H -->
    <rect x="640" y="190" width="28" height="160"/>
    <rect x="732" y="190" width="28" height="160"/>
    <rect x="668" y="255" width="64" height="30"/>
    <!-- S -->
    <rect x="780" y="190" width="100" height="28"/>
    <rect x="780" y="190" width="28" height="90"/>
    <rect x="780" y="252" width="100" height="28"/>
    <rect x="852" y="252" width="28" height="98"/>
    <rect x="780" y="322" width="100" height="28"/>
    <!-- P -->
    <path d="M900 190 H970 Q1010 190 1010 230 Q1010 270 970 270 H928 V350 H900 Z M928 218 H965 Q982 218 982 230 Q982 242 965 242 H928 Z"/>
    <!-- R -->
    <path d="M1030 190 H1100 Q1140 190 1140 230 Q1140 270 1100 270 H1058 V350 H1030 Z M1058 218 H1095 Q1112 218 1112 230 Q1112 242 1095 242 H1058 Z"/>
    <polygon points="1075,268 1107,268 1148,350 1114,350"/>
  </g>

  <!-- Underline -->
  <rect x="490" y="372" width="658" height="12" fill="#3A8FD6"/>

  <!-- Tagline -->
  <text x="490" y="446" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="6" fill="#7FB8E8">PROGRAMMING &amp; ROBOTICS CLUB</text>
  <text x="490" y="484" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" letter-spacing="3" fill="#5A7FA3">CUMILLA MODERN HIGH SCHOOL</text>
</svg>
